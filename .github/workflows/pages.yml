name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, continue/android-overlay-cloud]
    paths:
      - "web-client/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify PocketBase URL is baked in
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "Repository variable VITE_API_BASE_URL is not set"; exit 1; }
          grep -R "fieldops-pb.onrender.com" dist/assets/*.js > /dev/null || { echo "Deployed bundle does not reference the PocketBase Cloud instance"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

