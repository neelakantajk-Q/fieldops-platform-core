name: web-client build

on:
  push:
    branches: [main, continue/android-overlay-cloud]
    paths:
      - "web-client/**"
      - ".github/workflows/web-client.yml"
  pull_request:
    paths:
      - "web-client/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify PocketBase URL is baked in
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "Repository variable VITE_API_BASE_URL is not set"; exit 1; }
          grep -R "wzc6r4fspi7fdd2" dist/assets/*.js > /dev/null || { echo "Deployed bundle does not reference the PocketBase Cloud instance"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web-client-dist
          path: web-client/dist